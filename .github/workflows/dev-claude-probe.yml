name: Development Claude CLI probe
on:
  push:
    branches: [codex/claude-session-mapping]
    paths: [.github/workflows/dev-claude-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and verify official pinned release
        run: |
          mkdir -p /tmp/claude-probe/bin /tmp/claude-probe/private/config
          curl --fail --location --retry 2 https://github.com/anthropics/claude-code/releases/download/v2.1.283/claude-linux-x64.tar.gz -o /tmp/claude.tgz
          echo 'db404a91bec8baffb53463166fdc8bf579208a527d60afc2d984d7507dc0c2f9  /tmp/claude.tgz' | sha256sum --check
          tar -xzf /tmp/claude.tgz -C /tmp/claude-probe/bin
          find /tmp/claude-probe/bin -maxdepth 3 -type f
      - name: No-model help and version only
        run: |
          BIN=$(find /tmp/claude-probe/bin -type f -name claude | head -1)
          test -n "$BIN"
          chmod +x "$BIN"
          env -i PATH=/usr/bin:/bin HOME=/tmp/claude-probe/private CLAUDE_CONFIG_DIR=/tmp/claude-probe/private/config "$BIN" --version > /tmp/claude-probe/version.txt
          env -i PATH=/usr/bin:/bin HOME=/tmp/claude-probe/private CLAUDE_CONFIG_DIR=/tmp/claude-probe/private/config "$BIN" --help > /tmp/claude-probe/help.txt
          cat /tmp/claude-probe/version.txt
          cat /tmp/claude-probe/help.txt
          tar -czf /tmp/claude-probe.tgz -C /tmp/claude-probe bin version.txt help.txt
      - uses: actions/upload-artifact@v4
        with:
          name: claude-no-model-probe
          path: /tmp/claude-probe.tgz
          retention-days: 1
