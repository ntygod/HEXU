name: E0 bootstrap and verification
on:
  push:
    branches: ['codex/e0-workbench-*']
permissions:
  contents: write
concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve and lock dependencies
        run: npm install --ignore-scripts
      - run: npm run format
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Persist lock and formatted sources after successful checks
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json package.json tsconfig.server.json playwright.config.ts apps packages scripts tests
          if ! git diff --cached --quiet; then
            git commit -m 'build: lock dependencies and format verified E0 sources'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-e0-checks
          path: |
            playwright-report/
            test-results/
            artifacts/
          retention-days: 7
