name: Development archive source snapshot
on:
  push:
    branches: [codex/project-archive]
    paths: [.github/workflows/dev-archive-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 567427c9c0620d0d278b45c6b9b36beb4239e96f
          persist-credentials: false
          fetch-depth: 0
      - name: Export tracked public source only
        run: |
          git bundle create /tmp/hexu-main.bundle HEAD
          git archive --format=tar.gz HEAD > /tmp/hexu-main-source.tgz
          sha256sum /tmp/hexu-main.bundle /tmp/hexu-main-source.tgz > /tmp/hexu-main-checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hexu-archive-baseline
          path: |
            /tmp/hexu-main.bundle
            /tmp/hexu-main-source.tgz
            /tmp/hexu-main-checksums.txt
          retention-days: 1
