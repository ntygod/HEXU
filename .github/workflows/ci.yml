            test-results/project-task-status-*/error-context.md
          retention-days: 7
      - name: Upload project-task-attention failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-project-task-attention-failures
          path: |
            test-results/project-task-attention-*/trace.zip
            test-results/project-task-attention-*/test-failed-*.png
            test-results/project-task-attention-*/error-context.md
          retention-days: 7
      - name: Upload result-version-link failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-result-version-link-failures
          path: |
            test-results/result-version-link-*/trace.zip
            test-results/result-version-link-*/test-failed-*.png
            test-results/result-version-link-*/error-context.md
          retention-days: 7
      - name: Upload project-task-match-snippets failures
