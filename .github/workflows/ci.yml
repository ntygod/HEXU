        with:
          name: hexu-task-status-request-recovery-failures
          path: |
            test-results/task-status-request-recove*/trace.zip
            test-results/task-status-request-recove*/test-failed-*.png
            test-results/task-status-request-recove*/error-context.md
          retention-days: 7
      - name: Upload branch-results failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-branch-results-failures
          path: |
            test-results/branch-results-*/trace.zip
