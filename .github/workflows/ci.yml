      - name: Upload workbench-participating failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-workbench-participating-failures
          path: |
            test-results/workbench-participating-*/trace.zip
            test-results/workbench-participating-*/test-failed-*.png
            test-results/workbench-participating-*/error-context.md
          retention-days: 7

      - name: Upload workbench-cancelled-tasks failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-workbench-cancelled-tasks-failures
          path: |
            test-results/workbench-cancelled-tasks-*/trace.zip
            test-results/workbench-cancelled-tasks-*/test-failed-*.png
            test-results/workbench-cancelled-tasks-*/error-context.md
          retention-days: 7

      - name: Upload empty-workbench creation failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-empty-workbench-creation-failures
          path: |
            test-results/workbench-轻量新建*/trace.zip
            test-results/workbench-轻量新建*/test-failed-*.png
            test-results/workbench-轻量新建*/error-context.md
          retention-days: 7

      - name: Upload result-library-search failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-result-library-search-failures
          path: |
            test-results/result-library-search-*/trace.zip
            test-results/result-library-search-*/test-failed-*.png
            test-results/result-library-search-*/error-context.md
          retention-days: 7

      - name: Upload task-search-pagination failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-task-search-pagination-failures
          path: |
            test-results/task-search-pagination-*/trace.zip
            test-results/task-search-pagination-*/test-failed-*.png
