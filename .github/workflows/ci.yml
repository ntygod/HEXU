name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --reporter=line,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-browser-results
          path: |
            playwright-report/
            test-results/
            artifacts/
          retention-days: 7
      - name: Upload Task reliability previews
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-task-reliability-previews
          path: |
            artifacts/201-*.png
            artifacts/202-*.png
            artifacts/203-*.png
            artifacts/204-*.png
            artifacts/205-*.png
            artifacts/206-*.png
            artifacts/207-*.png
            artifacts/208-*.png
            artifacts/209-*.png
            artifacts/210-*.png
            artifacts/211-*.png
            artifacts/212-*.png
            artifacts/213-*.png
            artifacts/214-*.png
            artifacts/215-*.png
            artifacts/216-*.png
            artifacts/217-project-task-status-dark.png
            artifacts/218-project-task-status-mobile-light.png
            artifacts/219-project-task-attention-dark.png
            artifacts/220-project-task-attention-mobile-light.png
            artifacts/221-result-version-link-dark.png
            artifacts/222-result-version-link-mobile-light.png
            artifacts/223-project-task-match-dark.png
            artifacts/224-project-task-match-mobile-light.png
            artifacts/228-workbench-task-list-dark.png
            artifacts/229-workbench-task-list-mobile-light.png
            artifacts/230-workbench-participating-dark.png
            artifacts/231-workbench-participating-mobile-light.png
            artifacts/232-workbench-cancelled-dark.png
            artifacts/233-workbench-cancelled-mobile-light.png
            artifacts/234-result-library-search-dark.png
            artifacts/235-result-library-search-mobile-light.png
            artifacts/236-task-search-pagination-dark.png
            artifacts/237-task-search-pagination-mobile-light.png
            artifacts/238-task-search-scope-dark.png
            artifacts/239-task-search-scope-mobile-light.png
            artifacts/240-current-result-search-dark.png
            artifacts/241-current-result-search-mobile-light.png
            artifacts/107-branch-result-dark.png
            artifacts/108-branch-result-mobile.png
          retention-days: 7
      - name: Upload task-edit-baseline failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-task-edit-baseline-failures
          path: |
            test-results/task-edit-baseline-*/trace.zip
            test-results/task-edit-baseline-*/test-failed-*.png
            test-results/task-edit-baseline-*/error-context.md
          retention-days: 7
      - name: Upload cancelled-task-reopen failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-cancelled-task-reopen-failures
          path: |
            test-results/cancelled-task-reopen-*/trace.zip
            test-results/cancelled-task-reopen-*/test-failed-*.png
            test-results/cancelled-task-reopen-*/error-context.md
          retention-days: 7
      - name: Upload task-completion-dialog failures
