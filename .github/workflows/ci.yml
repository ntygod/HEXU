name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --reporter=line,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-browser-results
          path: |
            playwright-report/
            test-results/
            artifacts/
          retention-days: 7
      - name: Upload Task reliability previews
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-task-reliability-previews
          path: |
            artifacts/201-*.png
            artifacts/202-*.png
            artifacts/203-*.png
            artifacts/204-*.png
            artifacts/205-*.png
            artifacts/206-*.png
            artifacts/207-*.png
            artifacts/208-*.png
            artifacts/209-*.png
            artifacts/210-*.png
            artifacts/211-*.png
            artifacts/212-*.png
            artifacts/213-*.png
            artifacts/214-*.png
            artifacts/215-*.png
            artifacts/216-*.png
            artifacts/217-project-task-status-dark.png
            artifacts/218-project-task-status-mobile-light.png
            artifacts/219-project-task-attention-dark.png
            artifacts/220-project-task-attention-mobile-light.png
            artifacts/221-result-version-link-dark.png
            artifacts/222-result-version-link-mobile-light.png
            artifacts/107-branch-result-dark.png
            artifacts/108-branch-result-mobile.png
          retention-days: 7
      - name: Upload task-edit-baseline failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-task-edit-baseline-failures
          path: |
            test-results/task-edit-baseline-*/trace.zip
            test-results/task-edit-baseline-*/test-failed-*.png
            test-results/task-edit-baseline-*/error-context.md
          retention-days: 7
      - name: Upload cancelled-task-reopen failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-cancelled-task-reopen-failures
          path: |
            test-results/cancelled-task-reopen-*/trace.zip
            test-results/cancelled-task-reopen-*/test-failed-*.png
            test-results/cancelled-task-reopen-*/error-context.md
          retention-days: 7
      - name: Upload task-completion-dialog failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-task-completion-dialog-failures
          path: |
            test-results/task-completion-dialog-*/trace.zip
            test-results/task-completion-dialog-*/test-failed-*.png
            test-results/task-completion-dialog-*/error-context.md
          retention-days: 7
      - name: Upload task-cancellation failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-task-cancellation-failures
          path: |
            test-results/task-cancellation-*/trace.zip
            test-results/task-cancellation-*/test-failed-*.png
            test-results/task-cancellation-*/error-context.md
          retention-days: 7
      - name: Upload task-status-request-recovery failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-task-status-request-recovery-failures
          path: |
            test-results/task-status-request-recovery-*/trace.zip
            test-results/task-status-request-recovery-*/test-failed-*.png
            test-results/task-status-request-recovery-*/error-context.md
          retention-days: 7
      - name: Upload branch-results failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-branch-results-failures
          path: |
            test-results/branch-results-*/trace.zip
            test-results/branch-results-*/test-failed-*.png
            test-results/branch-results-*/error-context.md
          retention-days: 7
      - name: Upload direct-task-status-recovery failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-direct-task-status-recovery-failures
          path: |
            test-results/direct-task-status-recovery-*/trace.zip
            test-results/direct-task-status-recovery-*/test-failed-*.png
            test-results/direct-task-status-recovery-*/error-context.md
          retention-days: 7
      - name: Upload task-creation-request-recovery failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-task-creation-request-recovery-failures
          path: |
            test-results/task-creation-request-reco*/trace.zip
            test-results/task-creation-request-reco*/test-failed-*.png
            test-results/task-creation-request-reco*/error-context.md
          retention-days: 7
      - name: Upload project-task-status failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-project-task-status-failures
          path: |
            test-results/project-task-status-*/trace.zip
            test-results/project-task-status-*/test-failed-*.png
            test-results/project-task-status-*/error-context.md
          retention-days: 7
      - name: Upload project-task-attention failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-project-task-attention-failures
          path: |
            test-results/project-task-attention-*/trace.zip
            test-results/project-task-attention-*/test-failed-*.png
            test-results/project-task-attention-*/error-context.md
          retention-days: 7
      - name: Upload result-version-link failures
        uses: actions/upload-artifact@v4
        if: always() && (failure() || cancelled())
        with:
          name: hexu-result-version-link-failures
          path: |
            test-results/result-version-link-*/trace.zip
            test-results/result-version-link-*/test-failed-*.png
            test-results/result-version-link-*/error-context.md
          retention-days: 7

  check:
    needs: [engineering, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both suites to pass
        env:
          ENGINEERING_RESULT: ${{ needs.engineering.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$ENGINEERING_RESULT" = success
          test "$BROWSER_RESULT" = success
