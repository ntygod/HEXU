            test-results/current-result-search-*/trace.zip
            test-results/current-result-search-*/test-failed-*.png
            test-results/current-result-search-*/error-context.md
          retention-days: 7

  check:
    needs: [engineering, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both suites to pass
        env:
          ENGINEERING_RESULT: ${{ needs.engineering.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$ENGINEERING_RESULT" = success
          test "$BROWSER_RESULT" = success
