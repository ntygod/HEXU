name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run check
  browser:
    runs-on: ubuntu-latest
    # 143 real browser flows exceed the former 124-flow job's ~15 minute budget.
    # Individual test/assertion timeouts and retry policy remain unchanged.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-browser-results
          path: |
            playwright-report/
            test-results/
            artifacts/
          retention-days: 7
      # Keep the full report/trace artifact above. These focused previews remain
      # small enough to inspect even when the complete ZIP exceeds reader limits.
      # The two cross-service regressions also need individually retrievable
      # traces/screenshots if their original test still fails in a future run.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hexu-node-summary-failure
          path: test-results/nodes-*-CLI*/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hexu-participant-permission-failure
          path: test-results/team-只读成员自行参与*/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-code-diff-previews
          path: |
            artifacts/144-readable-line-diff-dark.png
            artifacts/145-readable-line-diff-mobile-light.png
            artifacts/146-readable-line-diff-mobile-changes.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-code-feedback-previews
          path: |
            artifacts/147-code-feedback-editor-dark.png
            artifacts/148-code-feedback-editor-mobile-light.png
            artifacts/149-code-feedback-fixed-location-mobile.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-feedback-reply-previews
          path: |
            artifacts/150-feedback-reply-dark.png
            artifacts/151-feedback-reply-mobile-light.png
            artifacts/152-feedback-reply-location-mobile.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-feedback-input-previews
          path: |
            artifacts/153-feedback-next-input-dark.png
            artifacts/154-feedback-next-input-mobile-light.png
            artifacts/155-feedback-branch-input-selection-mobile.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hexu-feedback-input-failures
          path: test-results/feedback-next-input-*/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-feedback-followup-previews
          path: |
            artifacts/156-feedback-followup-dark.png
            artifacts/157-feedback-followup-mobile-light.png
            artifacts/158-feedback-followup-origin-mobile.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hexu-feedback-followup-failures
          path: test-results/feedback-followups-*/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-member-version-previews
          path: |
            artifacts/159-member-version-editor-dark.png
            artifacts/160-member-version-editor-mobile-light.png
            artifacts/161-member-version-history-mobile.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hexu-member-version-failures
          path: test-results/member-result-versions-*/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-result-reference-previews
          path: |
            artifacts/162-result-reference-editor-dark.png
            artifacts/163-result-reference-editor-mobile-light.png
            artifacts/163b-result-reference-editor-mobile-actions.png
            artifacts/164-result-reference-history-mobile.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hexu-result-reference-failures
          path: test-results/result-references-*/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-project-result-previews
          path: |
            artifacts/165-project-results-dark.png
            artifacts/166-project-results-mobile-light.png
            artifacts/167-project-results-fixed-version-mobile.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hexu-project-result-failures
          path: test-results/project-results-*/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-result-activity-previews
          path: |
            artifacts/168-result-task-activity-dark.png
            artifacts/169-result-task-activity-mobile-light.png
            artifacts/170-result-task-activity-history-mobile.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hexu-result-activity-failures
          path: test-results/result-task-activity-*/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-task-edit-previews
          path: |
            artifacts/171-task-edit-baseline-dark.png
            artifacts/172-task-edit-baseline-mobile-light.png
            artifacts/173-task-edit-baseline-conflict-mobile.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hexu-task-edit-failures
          path: test-results/task-edit-baseline-*/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-task-filter-previews
          path: |
            artifacts/174-task-state-filters-dark.png
            artifacts/175-task-state-filters-mobile-light.png
            artifacts/176-task-state-filters-cancelled-mobile.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hexu-task-filter-failures
          path: test-results/task-state-filters-*/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-task-content-history-previews
          path: |
            artifacts/177-task-content-history-dark.png
            artifacts/178-task-content-history-mobile-light.png
            artifacts/179-task-content-history-legacy-mobile.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hexu-task-content-history-failures
          path: test-results/task-content-history-*/
          retention-days: 7
  check:
    needs: [engineering, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both suites to pass
        env:
          ENGINEERING_RESULT: ${{ needs.engineering.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$ENGINEERING_RESULT" = success
          test "$BROWSER_RESULT" = success
