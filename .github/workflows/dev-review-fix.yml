name: Development screenshot review correction
on:
  push:
    branches: [codex/claude-session-mapping]
    paths: [.github/workflows/dev-review-fix.yml]
permissions:
  contents: write
jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact reviewed UI correction
        run: |
          test "$(git rev-parse HEAD^)" = f0ea9ccd2f3bb04accb7d9f2895a5fb50d6407bb
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('apps/web/src/node-execution.tsx')
          s = p.read_text()
          old = '原生历史只保存在节点，将由 Codex\n                      重新读取。'
          new = "原生历史只保存在节点，将由{' '}\n                      {source.requestedTool === 'claude-code' ? 'Claude Code' : 'Codex'}{' '}\n                      重新读取。"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'b9ad0c95c8998e267cd11502192da8cd58beb67954e1997f59e6fe953a585957'
          p = Path('tests/e2e/node-execution.spec.ts')
          s = p.read_text()
          old = "      await way.selectOption('resume');\n"
          new = """      await way.selectOption('resume');
                const historyNotice = page.locator('.native-session-choice .notice-box');
                await expect(historyNotice).toContainText(`将由 ${toolName} 重新读取`);
                await expect(historyNotice).not.toContainText(
                  `将由 ${tool === 'codex' ? 'Claude Code' : 'Codex'} 重新读取`,
                );
          """
          new = '\n'.join(line[10:] if line.startswith('                ') or line == '          ' else line for line in new.split('\n'))
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '57bf03310853a6498f8ae068b9a8caf24e63fe93eb5fb896251f890034cb50ba'
          PY
          git diff --check
          git diff --stat
          git config user.name 'HEXU Development'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/node-execution.tsx tests/e2e/node-execution.spec.ts
          git commit -m 'fix: identify the selected native tool in history consent'
          test "$(git ls-remote origin refs/heads/codex/claude-session-mapping | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/claude-session-mapping
