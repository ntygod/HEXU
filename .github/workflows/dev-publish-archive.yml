name: Development project archive publication
on:
  push:
    branches: [codex/project-archive]
    paths: [.github/workflows/dev-publish-archive.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact reviewed source and remove temporary workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          shas = '''ecd1f226e6b3c0329a68126af379f23ccdd94a11
          12c41276b9f9915eafab372a3f705898527dccae
          eabcaf1a8fbc8efe6d4c56da7e684ea1fc1cf334
          a4e1366a01ef94f1d086f3bb0f1f830689ecb229
          7a0e829daae3234e9f42a8e180790127ea56ba9a
          da2030a47640e7c240a3536cb2775ab935808495
          1137bca1beaa05eb6d10cf6a9912bd6f242bf3eb
          08d637345a87b449545cff4623e24d37cb4114b5
          4173c56b68bf8432ad269dc714d7b07c22df28d5
          f1aacd1ae8d26cf63f7b995dc279ed05e42ee381
          2a603eef3058d61c039af12ffd1590aae68bd43e'''.split()
          fragments = []
          for sha in shas:
              reply = json.loads(subprocess.check_output(['gh', 'api', f'repos/ntygod/HEXU/git/blobs/{sha}']))
              blob = base64.b64decode(reply['content'])
              assert hashlib.sha1(f'blob {len(blob)}\0'.encode() + blob).hexdigest() == sha
              fragments.append(blob)
          patch = lzma.decompress(b''.join(fragments))
          assert len(patch) == 125037
          assert hashlib.sha256(patch).hexdigest() == '1c36cbb775d751229cadc281f853b6845744d073c74fc6fd96defd6f187c3520'
          pathlib.Path('/tmp/hexu-project-archive.patch').write_bytes(patch)
          PY
          git merge-base --is-ancestor 567427c9c0620d0d278b45c6b9b36beb4239e96f HEAD
          git apply --check /tmp/hexu-project-archive.patch
          git apply --index /tmp/hexu-project-archive.patch
          git rm .github/workflows/dev-archive-source.yml .github/workflows/dev-publish-archive.yml
          test "$(git write-tree)" = e43e15394d376aebb153a0ce48fc02f60cddbb5b
          git diff --cached --check
          git config user.name 'HEXU Development'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: archive projects without replaying execution'
          test "$(git ls-remote origin refs/heads/codex/project-archive | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/project-archive
          git log -1 --format='%H %T %s'
