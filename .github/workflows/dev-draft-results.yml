name: Record verified PR10 results
on:
  push:
    branches: [codex/ai-drafts-repro]
    paths: [.github/workflows/dev-draft-results.yml]
permissions:
  contents: write
jobs:
  record:
    if: github.repository == 'ntygod/HEXU' && github.actor == 'ntygod'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 24e9390c5c4e1bf8ec12671c496e7c71d49e36ec
      - name: Record completed checks in the existing four documents only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 24e9390c5c4e1bf8ec12671c496e7c71d49e36ec
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, before, after):
              p = Path(path)
              value = p.read_text()
              assert value.count(before) == 1, (path, value.count(before))
              p.write_text(value.replace(before, after))
          replace('docs/development/19-work-items.md', '浏览器交付检查以 21 为准。独立需求/成果目标、自动生成和批量采用仍缺。', '本机切片完整回归已通过，证据见 21。独立需求/成果目标、自动生成和批量采用仍缺。')
          replace('docs/development/21-implementation-status.md', '完整应用 Chromium 回归由原只读 CI 执行，结果待补录。', '完整应用 Chromium 回归由原只读 CI 执行，实际结果见下段。')
          replace('docs/development/21-implementation-status.md', '\n## 05-05/06 项目选材与运行快照历史增量', '\n最终 [Linux CI 36303698616](https://github.com/ntygod/HEXU/actions/runs/36303698616) 检查功能头 `24e9390c5c4e1bf8ec12671c496e7c71d49e36ec`（合并预览 `f1c385b`）：安装、格式、双端类型、生产构建、**270/270 工程测试和 74/74 Chromium 流程全部通过**，零失败、跳过或重试。原 256/68 保留，本切片累计新增 14 项工程检查和 6 项浏览器流程；此前失败的三个局部采用流程和新增真实鼠标拖选、表情/CRLF 反向键盘采用均通过。已下载产物 `10926741420`，核对实际报告并复查 64—66 深色采用、浅色历史及 390px 手机截图。后续结果补录仅修改 19/21/22/24 文档，源码、测试、配置和依赖保持已验证状态；临时开发工作流不进入 PR 源码树。原 102 项统计保持 **2 完成 / 64 部分 / 36 未实现**，下一切片是有限材料的真人协助。没有真实模型生成/恢复、provider receipt 或跨电脑联调。\n\n## 05-05/06 项目选材与运行快照历史增量')
          replace('docs/development/22-next-delivery.md', '05-04 当前先收口 PR #10 的只读局部选区修复与完整 Linux 浏览器回归，再合并交付；不得因单元检查通过就跳过仍失败的局部采用。实际结果以 [21](21-implementation-status.md) 为准。', '05-04 本机切片及只读局部选区修复已通过完整 Linux 回归：270 项工程检查、74 项 Chromium 流程全部通过，包含原先失败的局部采用与新增鼠标/键盘原文边界。实际证据见 [21](21-implementation-status.md)；下一切片按下文推进有限材料的真人协助，不重复已交付的草稿采用。')
          replace('docs/development/24-ai-handoff.md', '接手先按 21 核对 PR #10 完整回归和合并状态，不跳过失败用例。', '该修复的完整 Linux 回归已通过，实际证据见 21；后续保持这些选区及原文边界，不重复已交付切片。')
          PY
          git diff --check
          git add docs/development/19-work-items.md docs/development/21-implementation-status.md docs/development/22-next-delivery.md docs/development/24-ai-handoff.md
          python3 - <<'PY'
          import subprocess
          expected = ['docs/development/19-work-items.md','docs/development/21-implementation-status.md','docs/development/22-next-delivery.md','docs/development/24-ai-handoff.md']
          assert subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines() == expected
          assert subprocess.check_output(['git','write-tree']).decode().strip() == 'f88d5af85df6447d0d02273bd151755f48bf2cd8'
          PY
          git config user.name 'HEXU Development'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record verified AI draft delivery and next assistance slice'
          git push origin HEAD:refs/heads/codex/ai-drafts-selection-candidate
          git rev-parse HEAD
