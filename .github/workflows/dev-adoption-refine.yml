name: Publish reviewed adoption refinement
on:
  push:
    branches: [codex/adoption-review-dev]
    paths: [.github/workflows/dev-adoption-refine.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified two-file change
        shell: bash
        run: |
          git show "$GITHUB_SHA:dev/adoption-refinement.patch" > "$RUNNER_TEMP/adoption.patch"
          echo "831f904c2a70eea94d5ea1987a7ecc88234caf4f9dea87f0e1db61ee707396d9  $RUNNER_TEMP/adoption.patch" | sha256sum --check
          git checkout --detach fdffcb17b91ee372daf02fa977ead45d4366ba44
          git apply --check "$RUNNER_TEMP/adoption.patch"
          git apply --index "$RUNNER_TEMP/adoption.patch"
          test "$(git write-tree)" = 5f8dc4e11294ba81635073fb105db62a798fc252
          git config user.name 'HEXU Development'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false commit -m 'feat: show adoption context and verify revoked receipt confirmation'
          git push origin HEAD:refs/heads/codex/assistance-adoption-reviewed
