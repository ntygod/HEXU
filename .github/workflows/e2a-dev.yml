name: E2a development checks
on:
  push:
    branches: [codex/e2a-identity-spaces-20260926]
permissions:
  contents: write
concurrency:
  group: e2a-development
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e2a-identity-spaces-20260926
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply reviewed development integration
        run: |
          set -euo pipefail
          if [ -d .staging ]; then
            for patch in .staging/patch-*.py; do [ ! -f "$patch" ] || python "$patch"; done
          fi
          if ! node -e 'process.exit(JSON.parse(require("fs").readFileSync("package.json")).dependencies["better-auth"] === "1.7.6" ? 0 : 1)'; then
            npm install --save-exact --ignore-scripts better-auth@1.7.6
          else
            npm ci --ignore-scripts
          fi
      - run: npm run format
      - name: Preserve exact formatted development source
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/e2a-identity-spaces-20260926
          git config user.name 'HEXU development'
          git config user.email 'hexu-development@users.noreply.github.com'
          git add apps packages tests scripts docs README.md AGENTS.md package.json package-lock.json .env.example
          [ ! -d .staging ] || git add .staging
          if ! git diff --cached --quiet; then
            git commit -m 'feat: integrate E2a identity and permission slice'
            git push origin HEAD:codex/e2a-identity-spaces-20260926
          fi
          echo "Checked source: $(git rev-parse HEAD)"
      - name: Export public source and dependency sandbox without Git credentials
        run: |
          mkdir -p /tmp/hexu-source
          git archive HEAD | tar -x -C /tmp/hexu-source
          cp -a node_modules /tmp/hexu-source/
          cp "$(command -v node)" /tmp/hexu-source/node24
          tar -czf /tmp/hexu-development.tar.gz -C /tmp/hexu-source .
      - uses: actions/upload-artifact@v4
        with:
          name: hexu-e2a-development-sandbox
          path: /tmp/hexu-development.tar.gz
          retention-days: 2
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-e2a-browser-results
          path: |
            playwright-report/
            test-results/
            artifacts/
          retention-days: 7
