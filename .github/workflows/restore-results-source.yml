name: Restore results source
on:
  push:
    branches: [codex/checkpoint-restore-results]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive HEAD -o /tmp/hexu-results-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: hexu-results-source
          path: /tmp/hexu-results-source.tar
          retention-days: 1
