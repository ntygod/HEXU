name: Development task assignment publication
on:
  push:
    branches: [codex/task-assignment]
    paths: [.github/workflows/dev-apply-assignment.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact locally checked source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = c5779a1fbb8d09f56a79f79d09ddebf2a2fc4231
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          chunks = [
            '620e90949ea4d42a640bcde7728852a19601b6d5',
            '840ea3fca13f8e1e533f0dfc8da028adfa7ed4ed',
            'c5cc1bef2f1d23fd2dd912339016d19a939a3839',
            'c80a4c7a958f9b205a089e3dd69c7519a39f3798',
            '2246b4377b680303e1b58973b6853ff66bac5619',
            '856988588a74bad1c989e66dddb534bea0cd60e1',
            '736d501052ff58ee645892a1f3efef7035291d52',
            '88ff28be8ff8ad8efb34d2ebe6b3e0bb0ecffb33',
            '4b6a53829f55030dbc380f25c76ba8e576eae42a',
          ]
          text = b''
          for sha in chunks:
              value = json.loads(subprocess.check_output(['gh', 'api', f'repos/ntygod/HEXU/git/blobs/{sha}']))
              assert value['sha'] == sha and value['encoding'] == 'base64'
              part = base64.b64decode(value['content'])
              assert len(part) <= 4096
              assert hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() == sha
              text += part
          assert len(text) == 36368
          compressed = base64.b64decode(text, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'd1d45923eab848aabf2544ad11f8d97a671dff72b4733f0947fe6a09552f0b7f'
          patch = lzma.decompress(compressed)
          assert len(patch) == 103052
          assert hashlib.sha256(patch).hexdigest() == 'ba5f513a3baac58140e4dbca45b63cb8802d32298a1d7c3702bd5a1eb19cdb67'
          pathlib.Path('/tmp/assignment.patch').write_bytes(patch)
          PY
          git apply --check /tmp/assignment.patch
          git apply --index --binary /tmp/assignment.patch
          git rm .github/workflows/dev-apply-assignment.yml
          git diff --cached --check
          test "$(git write-tree)" = 0adebc7a6bd4ad866f3b2c9375b073dccd291991
          git config user.name 'HEXU Development'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add revision-safe human task assignment and audit history'
          test "$(git ls-remote origin refs/heads/codex/task-assignment | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/task-assignment
