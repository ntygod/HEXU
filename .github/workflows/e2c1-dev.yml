name: E2c1 development checks
on:
  push:
    branches: [codex/e2c1-codex-sessions-20260926]
permissions:
  contents: write
concurrency:
  group: e2c1-development
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e2c1-codex-sessions-20260926
      - name: Apply reviewed development source
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/e2c1-codex-sessions-20260926
          for patch in .staging/patch-*.py; do python "$patch"; done
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format
      - name: Preserve exact formatted development source
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/e2c1-codex-sessions-20260926
          git config user.name 'HEXU development'
          git config user.email 'hexu-development@users.noreply.github.com'
          git add apps packages tests docs scripts README.md AGENTS.md .staging
          if ! git diff --cached --quiet; then
            git commit -m 'feat: integrate E2c1 retained Codex sessions and native resume'
            git push origin HEAD:codex/e2c1-codex-sessions-20260926
          fi
          echo "Checked source: $(git rev-parse HEAD)"
      - name: Export credential-free source snapshot
        run: git archive --format=tar.gz HEAD > /tmp/hexu-e2c1-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: hexu-e2c1-source
          path: /tmp/hexu-e2c1-source.tar.gz
          retention-days: 2
      - run: npm run format:check
      - run: npm run check
        id: engineering
      - name: Official Codex pinned no-model compatibility
        run: |
          python - <<'PY'
          import urllib.request, json, hashlib, tarfile, pathlib, io, subprocess
          def read_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'HEXU-no-model-compatibility'})
              return json.load(urllib.request.urlopen(req, timeout=30))
          release = read_json('https://api.github.com/repos/openai/codex/releases/tags/rust-v0.157.0')
          assert release['tag_name'] == 'rust-v0.157.0'
          assets_url = release['assets_url']
          assert assets_url.startswith('https://api.github.com/repos/openai/codex/releases/')
          assets = []
          for page in range(1, 11):
              batch = read_json(assets_url + '?per_page=100&page=' + str(page))
              assets.extend(batch)
              if len(batch) < 100: break
          print('Pinned release:', release['id'], release['tag_name'])
          print('Published asset names:', json.dumps([a['name'] for a in assets]))
          matches = [a for a in assets if a['name'] == 'codex-x86_64-unknown-linux-gnu.tar.zst']
          assert len(matches) == 1, 'Expected exactly one pinned GNU archive'
          asset = matches[0]
          url = asset['browser_download_url']
          assert url == 'https://github.com/openai/codex/releases/download/rust-v0.157.0/codex-x86_64-unknown-linux-gnu.tar.zst'
          raw = urllib.request.urlopen(url, timeout=120).read()
          digest = 'sha256:' + hashlib.sha256(raw).hexdigest()
          assert asset.get('digest') == digest == 'sha256:aa662949f34e1db0ba7e09f7f5bcbf92b5d6ba681fbd9348cf1e80b1d9b6a3d4', (asset.get('digest'), digest)
          print('Official pinned asset:', asset['name'], digest)
          out = pathlib.Path('/tmp/hexu-official-codex'); out.mkdir()
          unpacked = subprocess.run(['zstd', '-d', '-c'], input=raw, stdout=subprocess.PIPE, check=True).stdout
          with tarfile.open(fileobj=io.BytesIO(unpacked), mode='r:') as archive:
              names = [m.name for m in archive.getmembers() if m.isfile()]
              print('Archive regular files:', json.dumps(names))
              member = next(m for m in archive.getmembers() if m.isfile() and pathlib.PurePosixPath(m.name).name == 'codex-x86_64-unknown-linux-gnu')
              binary = out / 'codex'
              binary.write_bytes(archive.extractfile(member).read())
              binary.chmod(0o700)
          PY
          /tmp/hexu-official-codex/codex --version
          node scripts/check-codex-protocol.mjs /tmp/hexu-official-codex/codex
      - run: npx playwright install --with-deps chromium
        if: ${{ !cancelled() && steps.engineering.outcome == 'success' }}
      - run: npm run test:e2e
        if: ${{ !cancelled() && steps.engineering.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-e2c1-browser-results
          path: |
            playwright-report/
            test-results/
            artifacts/
          retention-days: 7
