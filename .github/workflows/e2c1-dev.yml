name: E2c1 development checks
on:
  push:
    branches: [codex/e2c1-codex-sessions-20260926]
permissions:
  contents: write
concurrency:
  group: e2c1-development
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/e2c1-codex-sessions-20260926
      - name: Apply reviewed development source
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/e2c1-codex-sessions-20260926
          for patch in .staging/patch-*.py; do python "$patch"; done
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format
      - name: Preserve exact formatted development source
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/e2c1-codex-sessions-20260926
          git config user.name 'HEXU development'
          git config user.email 'hexu-development@users.noreply.github.com'
          git add apps packages tests docs scripts README.md AGENTS.md .staging
          if ! git diff --cached --quiet; then
            git commit -m 'feat: integrate E2c1 retained Codex sessions and native resume'
            git push origin HEAD:codex/e2c1-codex-sessions-20260926
          fi
          echo "Checked source: $(git rev-parse HEAD)"
      - name: Export credential-free source snapshot
        run: git archive --format=tar.gz HEAD > /tmp/hexu-e2c1-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: hexu-e2c1-source
          path: /tmp/hexu-e2c1-source.tar.gz
          retention-days: 2
      - run: npm run format:check
      - run: npm run check
        id: engineering
      - name: Official Codex pinned no-model compatibility
        run: |
          python - <<'PY'
          import urllib.request, json, hashlib, tarfile, pathlib, io, os
          req = urllib.request.Request('https://api.github.com/repos/openai/codex/releases/assets/587334214', headers={'User-Agent': 'HEXU-no-model-compatibility'})
          asset = json.load(urllib.request.urlopen(req, timeout=30))
          name = 'codex-package-x86_64-unknown-linux-musl.tar.gz'
          assert asset['name'] == name
          url = asset['browser_download_url']
          assert url == 'https://github.com/openai/codex/releases/download/rust-v0.157.0/' + name
          raw = urllib.request.urlopen(url, timeout=120).read()
          digest = 'sha256:' + hashlib.sha256(raw).hexdigest()
          assert asset.get('digest') == digest == 'sha256:042f851ea3fc1083c45157520520944fc790632b53ebc580fc98eaca55862a25'
          print('Official pinned asset:', asset['id'], name, digest)
          out = pathlib.Path('/tmp/hexu-official-codex'); out.mkdir()
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
              archive.extractall(out, filter='data')
          candidates = [p for p in out.rglob('codex') if p.is_file() and p.parent.name == 'bin']
          assert len(candidates) == 1, [str(p) for p in candidates]
          binary = candidates[0].resolve()
          assert binary.is_relative_to(out)
          print('Official package entrypoint:', binary)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CODEX_CHECK_BINARY=' + str(binary) + '\n')
          PY
      - name: Check official native protocol without model calls
        run: |
          "$CODEX_CHECK_BINARY" --version
          node scripts/check-codex-protocol.mjs "$CODEX_CHECK_BINARY"
      - run: npx playwright install --with-deps chromium
        if: ${{ !cancelled() && steps.engineering.outcome == 'success' }}
      - run: npm run test:e2e
        if: ${{ !cancelled() && steps.engineering.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-e2c1-browser-results
          path: |
            playwright-report/
            test-results/
            artifacts/
          retention-days: 7
