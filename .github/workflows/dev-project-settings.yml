name: Development project settings publication
on:
  push:
    branches: [codex/project-settings]
    paths: [.github/workflows/dev-project-settings.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply verified source and remove temporary publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = ba69b0ce79027aa3d30400f8e6f657c3abd89cd6
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          chunks = [
              'b43f58d187dbce1f51bdf1538c5dfdee004186a5',
              '23e3a58855578f2eb3743f245242d452af88245f',
              'bd613f16fd2571206f88f0002bab03f9d2909027',
              '34be8b7d6aad23d1ae3237014d8074cda68aa3a1',
          ]
          data = bytearray()
          for sha in chunks:
              blob = json.loads(subprocess.check_output(['gh', 'api', f'repos/ntygod/HEXU/git/blobs/{sha}']))
              raw = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
              data.extend(raw)
          patch = gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == '82f26de25a338c8625f37fda7285b394d5652faca69e60606459087d5bb17022'
          path = pathlib.Path('/tmp/hexu-project-settings.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          PY
          git rm .github/workflows/dev-project-settings.yml
          git diff --cached --check
          test "$(git write-tree)" = 4040a41a88dc8895faf7a8c927ec0e6c962fc75b
          git config user.name 'HEXU Development'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add revision-safe project settings and history'
          git push origin HEAD:refs/heads/codex/project-settings
