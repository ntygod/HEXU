name: Transfer source snapshot
on:
  push:
    branches: [codex/checkpoint-transfer]
    paths: [.github/workflows/transfer-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD > /tmp/hexu-transfer-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: hexu-transfer-source
          path: /tmp/hexu-transfer-source.tar
          retention-days: 1
