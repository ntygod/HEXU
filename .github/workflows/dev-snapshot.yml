name: Development workspace snapshot
on:
  push:
    branches: [codex/claude-session-mapping]
    paths: [.github/workflows/dev-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Package tracked source and disposable test tooling only
        run: |
          mkdir -p /tmp/hexu-development/source /tmp/hexu-development/tooling
          git archive HEAD | tar -x -C /tmp/hexu-development/source
          cp -a node_modules /tmp/hexu-development/source/node_modules
          cp "$(command -v node)" /tmp/hexu-development/tooling/node
          tar -czf /tmp/hexu-development.tgz -C /tmp/hexu-development .
      - uses: actions/upload-artifact@v4
        with:
          name: hexu-development-workspace
          path: /tmp/hexu-development.tgz
          retention-days: 1
