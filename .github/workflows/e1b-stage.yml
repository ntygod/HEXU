name: E1b Codex and continuation integration
on:
  push:
    branches: ['codex/e1b-codex-continuation-20260925']
    paths: ['.github/workflows/e1b-stage.yml']
permissions:
  contents: write
concurrency:
  group: e1b-stage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update visible version and capture continuation source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/App.tsx')
          s = p.read_text()
          assert s.count('E1a') == 2
          p.write_text(s.replace('E1a', 'E1b'))
          p = Path('tests/e2e/native.spec.ts')
          s = p.read_text()
          anchor = "  await page.screenshot({ path: 'artifacts/09-codex-continuation.png', fullPage: true });"
          assert s.count(anchor) == 1
          replacement = "  await page.getByText('查看接续上下文与代码来源', { exact: true }).click();\n  await page.locator('.drawer-form .dialog-body').evaluate((element) => { element.scrollTop = 0; });\n" + anchor
          p.write_text(s.replace(anchor, replacement))
          PY
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/web/src/App.tsx tests/e2e/native.spec.ts
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Persist tested refinements on development branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/App.tsx tests/e2e/native.spec.ts
          git commit -m 'fix: align E1b version labels and capture continuation source context'
          git push origin "HEAD:$TARGET_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hexu-e1b-browser-results
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 7
