name: PR10 reproduction export
on:
  push:
    branches: [codex/ai-drafts-repro]
    paths: [.github/workflows/dev-repro-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f8f8e5855a81175ed9864fb03dc67bc7ba270458
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Export tracked source and clean dependencies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hexu-repro/source" "$RUNNER_TEMP/hexu-repro/runtime"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/hexu-repro/source"
          cp -a node_modules "$RUNNER_TEMP/hexu-repro/source/"
          cp "$(command -v node)" "$RUNNER_TEMP/hexu-repro/runtime/node"
          git rev-parse HEAD > "$RUNNER_TEMP/hexu-repro/BASE_COMMIT"
          tar -czf "$RUNNER_TEMP/hexu-pr10-repro.tar.gz" -C "$RUNNER_TEMP" hexu-repro
          sha256sum "$RUNNER_TEMP/hexu-pr10-repro.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: hexu-pr10-repro
          path: ${{ runner.temp }}/hexu-pr10-repro.tar.gz
          retention-days: 1
          compression-level: 0
