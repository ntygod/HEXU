name: Publish fixed PR10 selection tree
on:
  push:
    branches: [codex/ai-drafts-repro]
    paths: [.github/workflows/dev-draft-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'ntygod/HEXU' && github.actor == 'ntygod'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: staging
          persist-credentials: false
      - name: Decode checksum-bound source patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          encoded = Path('staging/.github/dev/pr10-selection.patch.gz.b64').read_text().strip()
          encoded = encoded.replace('wfzcs9HHP', 'wfzcsz9HHP').replace('XfzxeC9y5', 'Xfzxe9y5')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '50a2b0d21b33a0e62b63db6c08c41cbd4237236353d1486a039249414738eca4'
          Path(os.environ['RUNNER_TEMP'], 'selection.patch').write_bytes(patch)
          PY
      - uses: actions/checkout@v4
        with:
          ref: f8f8e5855a81175ed9864fb03dc67bc7ba270458
          path: implementation
      - name: Publish exact source tree to isolated candidate branch
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f8f8e5855a81175ed9864fb03dc67bc7ba270458
          git apply --index "$RUNNER_TEMP/selection.patch"
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = ['apps/web/src/draft-adoption.tsx', 'apps/web/src/draft-selection.ts', 'docs/development/19-work-items.md', 'docs/development/21-implementation-status.md', 'docs/development/22-next-delivery.md', 'docs/development/24-ai-handoff.md', 'docs/engineering/ai-drafts.md', 'tests/draft-selection.test.ts', 'tests/e2e/ai-drafts.spec.ts']
          assert subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines() == expected
          assert subprocess.check_output(['git','write-tree']).decode().strip() == '94672ff980451a0fee8db5638ac982fddfc81caf'
          PY
          git config user.name 'HEXU Development'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve read-only draft selection and original text offsets'
          git push origin HEAD:refs/heads/codex/ai-drafts-selection-candidate
          git rev-parse HEAD | tee "$RUNNER_TEMP/selection-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: hexu-pr10-selection-commit
          path: ${{ runner.temp }}/selection-commit.txt
          retention-days: 1
